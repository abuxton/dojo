# Project N.O.M.A.D. – Docker Compose for Local Learning
#
# Based on the official management compose template:
# https://raw.githubusercontent.com/Crosstalk-Solutions/project-nomad/refs/heads/main/install/management_compose.yaml
#
# Quick start:
#   1. cp .env.example .env
#   2. Edit .env – set APP_KEY (≥16 chars), URL, and passwords
#   3. docker compose up -d
#   4. Open http://localhost:8080 in your browser
#
# Data is persisted in Docker-managed named volumes so nothing is written
# outside this project directory.

name: project-nomad

services:

  # ── Admin / Command-Center UI ────────────────────────────────────────────────
  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:latest
    pull_policy: always
    container_name: nomad_admin
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux
    ports:
      - "8080:8080"
    volumes:
      - nomad-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      - NODE_ENV=production
      - PORT=8080
      - LOG_LEVEL=info
      - APP_KEY=${APP_KEY}
      - HOST=0.0.0.0
      - URL=${URL:-http://localhost:8080}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=nomad
      - DB_USER=nomad_user
      - DB_PASSWORD=${DB_PASSWORD}
      # DB_NAME mirrors DB_DATABASE; both are required by the admin application
      - DB_NAME=nomad
      - DB_SSL=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Log viewer (optional but recommended) ────────────────────────────────────
  dozzle:
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false

  # ── MySQL database ────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nomad
      - MYSQL_USER=nomad_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - nomad-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Redis cache ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - nomad-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Auto-updater sidecar ──────────────────────────────────────────────────────
  updater:
    image: ghcr.io/crosstalk-solutions/project-nomad-sidecar-updater:latest
    pull_policy: always
    container_name: nomad_updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/shared

  # ── Disk-usage collector ──────────────────────────────────────────────────────
  disk-collector:
    image: ghcr.io/crosstalk-solutions/project-nomad-disk-collector:latest
    pull_policy: always
    container_name: nomad_disk_collector
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
      - nomad-storage:/storage

# ── Named volumes (data lives inside Docker; no host paths required) ──────────
volumes:
  nomad-storage:
    driver: local
  nomad-mysql:
    driver: local
  nomad-redis:
    driver: local
  nomad-update-shared:
    driver: local
